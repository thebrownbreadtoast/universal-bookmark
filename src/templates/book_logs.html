<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Logs — Universal Bookmark</title>
    <link rel="stylesheet" href="/static/base.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{{ url_for('bookmarks', id=bookmark.id) }}" class="header-back">&#8592; Library</a>
            <span class="site-title">Universal Bookmark</span>
        </div>
    </header>

    <main class="page-wrapper">
        <p class="page-title">Reading logs for <em>{{ title }}</em></p>

        {% if book_logs %}
            {% for log in book_logs %}
            <div class="log-card">
                <div class="log-header">
                    <span class="log-pages">Pages {{ log.start_page }} &rarr; {{ log.end_page }}</span>
                    <span class="log-date">{{ log.logged_at }}</span>
                </div>
                {% if log.note %}
                <div class="log-note">{{ log.note }}</div>
                {% endif %}
            </div>
            {% endfor %}
        {% else %}
            <div class="log-card">
                <p class="log-empty">No reading sessions recorded yet.</p>
            </div>
        {% endif %}
    </main>
</body>
</html>
