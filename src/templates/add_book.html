<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book — Universal Bookmark</title>
    <link rel="stylesheet" href="/static/base.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/bookmarks/{{ id }}" class="header-back">&#8592; Library</a>
            <span class="site-title">Universal Bookmark</span>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="form-card">
            <h2 class="form-card-title">Add New Book</h2>
            <form action="/bookmarks/{{ id }}/add" method="POST">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. The Name of the Rose" required>
                </div>

                <div class="form-group">
                    <label for="current_page">Current Page</label>
                    <input type="number" id="current_page" name="current_page" placeholder="0" min="0" required>
                </div>

                <div class="form-group">
                    <label for="total_pages">Total Pages</label>
                    <input type="number" id="total_pages" name="total_pages" placeholder="0" min="1" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save to Library</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
