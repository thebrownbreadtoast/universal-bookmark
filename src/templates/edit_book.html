<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book — Universal Bookmark</title>
    <link rel="stylesheet" href="/static/base.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/bookmarks/{{ id }}" class="header-back">&#8592; Library</a>
            <span class="site-title">Universal Bookmark</span>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="form-card">
            <h2 class="form-card-title">Log Reading Session</h2>
            <form action="/bookmarks/{{ id }}/edit/{{ book.id }}" method="POST">
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ book.title }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="current_page">Current Page</label>
                    <input
                        type="number"
                        id="current_page"
                        name="current_page"
                        value="{{ book.current_page }}"
                        min="0"
                        required>
                </div>

                <div class="form-group">
                    <label for="total_pages">Total Pages</label>
                    <input
                        type="number"
                        id="total_pages"
                        name="total_pages"
                        value="{{ book.total_pages }}"
                        min="1"
                        required>
                </div>

                <div class="form-group">
                    <label for="note">Reading Note</label>
                    <textarea
                        id="note"
                        name="note"
                        class="note-field"
                        placeholder="Jot down your thoughts on today's reading..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Session</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
